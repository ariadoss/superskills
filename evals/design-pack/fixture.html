<!doctype html>
<html>
<head>
<title>Payroll</title>
<style>
body { font-family: Inter, sans-serif; background: #fff; color: #000; margin: 0; }
.hero { background: linear-gradient(135deg, #8b5cf6, #ec4899, #f59e0b); padding: 70px 15px; text-align: center; color: #fff; }
.hero h1 { font-size: 23px; }
.card { border-left: 4px solid #8b5cf6; border-radius: 12px; padding: 18px; margin: 13px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
.btn { background: #8b5cf6; color: #fff; padding: 7px 15px; border: none; outline: none; transition: all .3s; }
input { padding: 9px; outline: none; }
.grid { display: flex; gap: 11px; padding: 17px; }
</style>
</head>
<body>
<div class="hero"><h1>🚀 Payroll made easy ✨</h1><p>The all-in-one platform</p><div class="btn" onclick="go()">🎉 Get Started</div></div>
<div class="grid">
<div class="card"><h3>Fast</h3><p>Run payroll in minutes.</p></div>
<div class="card"><h3>Secure</h3><p>Bank-grade security.</p></div>
<div class="card"><h3>Smart</h3><p>AI-powered insights.</p></div>
</div>
<form><input placeholder="Email"><button class="btn">Sign up</button><button class="btn" disabled>Wait</button></form>
<img src="team.png">
</body>
</html>
